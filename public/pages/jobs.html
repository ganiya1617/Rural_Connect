<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs & Internships – RuralConnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">🌱</div>
        <span>RuralConnect</span>
      </a>
      <button class="menu-toggle" aria-label="Toggle Navigation">☰</button>
      <ul class="nav-links" id="user-nav-links"></ul>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <main style="max-width: 1240px; margin: 0 auto; padding: 2.5rem 1.5rem;">
    <div style="margin-bottom: 2rem;">
      <span class="badge badge-blue" style="margin-bottom: 0.5rem;">Career Pathways</span>
      <h1 style="font-size: 2.2rem; color: var(--deep-navy); margin-bottom: 0.5rem;">Jobs & Student Internships</h1>
      <p style="color: var(--secondary-text); font-size: 1.05rem;">
        Launch your professional journey with digital internships, fellowships, and youth opportunities.
      </p>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="card" style="padding: 1.25rem; margin-bottom: 2rem;">
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem; align-items: center;">
        <input type="text" id="job-search" class="form-control" placeholder="🔍 Search position, company, or skills...">
        <select id="job-type-filter" class="form-control">
          <option value="">All Opportunity Types</option>
          <option value="INTERNSHIP">Internships</option>
          <option value="FULL_TIME">Full-time Roles</option>
          <option value="PART_TIME">Part-time / Remote</option>
        </select>
        <input type="text" id="job-location-filter" class="form-control" placeholder="📍 Location (e.g. Remote)">
      </div>
    </div>

    <!-- Jobs Grid -->
    <div class="content-grid" id="jobs-grid">
      <div class="loading-spinner" style="margin: 3rem auto; grid-column: 1 / -1;"></div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/jobs.js"></script>
</body>
</html>
