<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Resources – RuralConnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">🌱</div>
        <span>RuralConnect</span>
      </a>
      <button class="menu-toggle" aria-label="Toggle Navigation">☰</button>
      <ul class="nav-links" id="user-nav-links"></ul>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <main style="max-width: 1240px; margin: 0 auto; padding: 2.5rem 1.5rem;">
    <!-- Page Header -->
    <div style="margin-bottom: 2rem;">
      <span class="badge badge-blue" style="margin-bottom: 0.5rem;">Curated Open Education</span>
      <h1 style="font-size: 2.2rem; color: var(--deep-navy); margin-bottom: 0.5rem;">Learning Resources Repository</h1>
      <p style="color: var(--secondary-text); font-size: 1.05rem;">
        Discover free textbooks, video lectures, and study guides tailored for rural learners.
      </p>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="card" style="padding: 1.25rem; margin-bottom: 2rem;">
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem; align-items: center;" id="filter-grid">
        <!-- Search Input -->
        <div>
          <input type="text" id="search-input" class="form-control" placeholder="🔍 Search by topic, subject, or keywords...">
        </div>

        <!-- Subject Select -->
        <div>
          <select id="subject-filter" class="form-control">
            <option value="">All Subjects</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Science">Science</option>
            <option value="Mathematics">Mathematics</option>
            <option value="English">English</option>
            <option value="History">History</option>
          </select>
        </div>

        <!-- Type Select -->
        <div>
          <select id="type-filter" class="form-control">
            <option value="">All Formats (Video/PDF/Article)</option>
            <option value="VIDEO">Video Tutorials</option>
            <option value="PDF">PDF Books & Solutions</option>
            <option value="ARTICLE">Articles & Guides</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Active Count & Bookmarks View Toggle -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
      <div id="resource-count" style="font-weight: 500; color: var(--secondary-text);">
        Loading educational materials...
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button id="view-all-btn" class="btn btn-primary btn-sm" onclick="toggleSavedFilter(false)">All Resources</button>
        <button id="view-saved-btn" class="btn btn-outline btn-sm" onclick="toggleSavedFilter(true)">🔖 My Saved Bookmarks</button>
      </div>
    </div>

    <!-- Resources Content Grid -->
    <div class="content-grid" id="resources-grid">
      <div class="loading-spinner" style="margin: 3rem auto; grid-column: 1 / -1;"></div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/resources.js"></script>
</body>
</html>
